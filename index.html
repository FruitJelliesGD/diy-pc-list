<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC 配置单</title>
    <style>
        :root {
            --surface-page: #f3f4f6;
            --surface-card: #ffffff;
            --surface-header: #f9fafb;
            --surface-input: #ffffff;
            --surface-hover: #f8fafc;
            --surface-total: #fffbeb;
            --border-light: #e5e7eb;
            --border-default: #d1d5db;
            --border-total: #f59e0b;
            --border-focus: #6366f1;
            --border-error: #ef4444;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --text-muted: #9ca3b0;
            --text-total: #92400e;
            --text-total-price: #b45309;
            --accent: #6366f1;
            --accent-subtle: #eef2ff;
            --accent-subtle-text: #4338ca;
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --danger-subtle: #fef2f2;
            --warning: #f59e0b;
            --btn-ghost-bg: #ffffff;
            --btn-ghost-border: #d1d5db;
            --btn-ghost-text: #374151;
            --btn-success-bg: #10b981;
            --btn-success-text: #ffffff;
            --btn-copy-bg: #ecfdf5;
            --btn-copy-border: #6ee7b7;
            --btn-copy-text: #065f46;
            --btn-reset-bg: #fffbeb;
            --btn-reset-border: #fcd34d;
            --btn-reset-text: #92400e;
            --btn-clear-bg: #fef2f2;
            --btn-clear-border: #fca5a5;
            --btn-clear-text: #991b1b;
            --btn-import-bg: #eff6ff;
            --btn-import-border: #93c5fd;
            --btn-import-text: #1e40af;
            --btn-share-bg: #eef2ff;
            --btn-share-border: #a5b4fc;
            --btn-share-text: #4338ca;
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-full: 9999px;
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 12px;
            --space-lg: 16px;
            --space-xl: 20px;
            --space-2xl: 24px;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            --font-mono: "SF Mono", "Cascadia Code", "Consolas", "Menlo", monospace;
            --text-xs: 11px;
            --text-sm: 13px;
            --text-base: 14px;
            --text-lg: 15px;
            --text-xl: 16px;
            --text-2xl: 18px;
            --text-3xl: 22px;
            --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.06), 0 1px 4px rgba(0, 0, 0, 0.04);
            --shadow-modal: 0 12px 40px rgba(0, 0, 0, 0.12);
            --modal-overlay: rgba(0, 0, 0, 0.35);
            --toast-bg: #1f2937;
            --toast-text: #f9fafb;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --surface-page: #111318;
                --surface-card: #1a1d24;
                --surface-header: #1e2128;
                --surface-input: #16181d;
                --surface-hover: #1f2229;
                --surface-total: #1f1b12;
                --border-light: #262932;
                --border-default: #2e313a;
                --border-total: #b45309;
                --border-focus: #818cf8;
                --border-error: #f87171;
                --text-primary: #e5e7eb;
                --text-secondary: #9ca3b0;
                --text-muted: #6b7280;
                --text-total: #fcd34d;
                --text-total-price: #fbbf24;
                --accent: #818cf8;
                --accent-subtle: #1e1b4b;
                --accent-subtle-text: #a5b4fc;
                --success: #34d399;
                --success-hover: #10b981;
                --danger: #f87171;
                --danger-subtle: #1c1212;
                --warning: #fbbf24;
                --btn-ghost-bg: #1e2128;
                --btn-ghost-border: #2e313a;
                --btn-ghost-text: #d1d5db;
                --btn-success-bg: #059669;
                --btn-success-text: #ffffff;
                --btn-copy-bg: #0a2e1f;
                --btn-copy-border: #047857;
                --btn-copy-text: #6ee7b7;
                --btn-reset-bg: #2d1a05;
                --btn-reset-border: #b45309;
                --btn-reset-text: #fcd34d;
                --btn-clear-bg: #2d1111;
                --btn-clear-border: #b91c1c;
                --btn-clear-text: #fecaca;
                --btn-import-bg: #0f1d3a;
                --btn-import-border: #1d4ed8;
                --btn-import-text: #93c5fd;
                --btn-share-bg: #1e1b4b;
                --btn-share-border: #4338ca;
                --btn-share-text: #a5b4fc;
                --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.35);
                --shadow-modal: 0 12px 40px rgba(0, 0, 0, 0.5);
                --modal-overlay: rgba(0, 0, 0, 0.6);
                --toast-bg: #374151;
                --toast-text: #f9fafb;
            }
        }

        html.dark-mode {
            --surface-page: #111318;
            --surface-card: #1a1d24;
            --surface-header: #1e2128;
            --surface-input: #16181d;
            --surface-hover: #1f2229;
            --surface-total: #1f1b12;
            --border-light: #262932;
            --border-default: #2e313a;
            --border-total: #b45309;
            --border-focus: #818cf8;
            --border-error: #f87171;
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3b0;
            --text-muted: #6b7280;
            --text-total: #fcd34d;
            --text-total-price: #fbbf24;
            --accent: #818cf8;
            --accent-subtle: #1e1b4b;
            --accent-subtle-text: #a5b4fc;
            --success: #34d399;
            --success-hover: #10b981;
            --danger: #f87171;
            --danger-subtle: #1c1212;
            --warning: #fbbf24;
            --btn-ghost-bg: #1e2128;
            --btn-ghost-border: #2e313a;
            --btn-ghost-text: #d1d5db;
            --btn-success-bg: #059669;
            --btn-success-text: #ffffff;
            --btn-copy-bg: #0a2e1f;
            --btn-copy-border: #047857;
            --btn-copy-text: #6ee7b7;
            --btn-reset-bg: #2d1a05;
            --btn-reset-border: #b45309;
            --btn-reset-text: #fcd34d;
            --btn-clear-bg: #2d1111;
            --btn-clear-border: #b91c1c;
            --btn-clear-text: #fecaca;
            --btn-import-bg: #0f1d3a;
            --btn-import-border: #1d4ed8;
            --btn-import-text: #93c5fd;
            --btn-share-bg: #1e1b4b;
            --btn-share-border: #4338ca;
            --btn-share-text: #a5b4fc;
            --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.35);
            --shadow-modal: 0 12px 40px rgba(0, 0, 0, 0.5);
            --modal-overlay: rgba(0, 0, 0, 0.6);
            --toast-bg: #374151;
            --toast-text: #f9fafb;
        }

        html.light-mode {
            --surface-page: #f3f4f6;
            --surface-card: #ffffff;
            --surface-header: #f9fafb;
            --surface-input: #ffffff;
            --surface-hover: #f8fafc;
            --surface-total: #fffbeb;
            --border-light: #e5e7eb;
            --border-default: #d1d5db;
            --border-total: #f59e0b;
            --border-focus: #6366f1;
            --border-error: #ef4444;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --text-muted: #9ca3b0;
            --text-total: #92400e;
            --text-total-price: #b45309;
            --accent: #6366f1;
            --accent-subtle: #eef2ff;
            --accent-subtle-text: #4338ca;
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --danger-subtle: #fef2f2;
            --warning: #f59e0b;
            --btn-ghost-bg: #ffffff;
            --btn-ghost-border: #d1d5db;
            --btn-ghost-text: #374151;
            --btn-success-bg: #10b981;
            --btn-success-text: #ffffff;
            --btn-copy-bg: #ecfdf5;
            --btn-copy-border: #6ee7b7;
            --btn-copy-text: #065f46;
            --btn-reset-bg: #fffbeb;
            --btn-reset-border: #fcd34d;
            --btn-reset-text: #92400e;
            --btn-clear-bg: #fef2f2;
            --btn-clear-border: #fca5a5;
            --btn-clear-text: #991b1b;
            --btn-import-bg: #eff6ff;
            --btn-import-border: #93c5fd;
            --btn-import-text: #1e40af;
            --btn-share-bg: #eef2ff;
            --btn-share-border: #a5b4fc;
            --btn-share-text: #4338ca;
            --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.06), 0 1px 4px rgba(0, 0, 0, 0.04);
            --shadow-modal: 0 12px 40px rgba(0, 0, 0, 0.12);
            --modal-overlay: rgba(0, 0, 0, 0.35);
            --toast-bg: #1f2937;
            --toast-text: #f9fafb;
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        html,
        body {
            height: 100%;
            overflow: hidden
        }

        body {
            font-family: var(--font-sans);
            background: var(--surface-page);
            display: flex;
            justify-content: center;
            align-items: stretch;
            padding: 16px;
            color: var(--text-primary);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased
        }

        .container {
            width: 100%;
            max-width: 960px;
            background: var(--surface-card);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-light);
            overflow: hidden;
            display: flex;
            flex-direction: column
        }

        .header {
            flex-shrink: 0;
            padding: var(--space-xl) var(--space-2xl);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: var(--space-md);
            background: var(--surface-header)
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: var(--space-sm)
        }

        .header-icon {
            font-size: 26px;
            line-height: 1
        }

        .header h1 {
            font-size: var(--text-3xl);
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -.3px
        }

        .title-input {
            font-size: var(--text-3xl);
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -.3px;
            background: transparent;
            border: none;
            outline: none;
            padding: 0;
            margin: 0;
            width: 260px;
            font-family: inherit;
            cursor: text;
            caret-color: var(--accent);
            border-bottom: 2px solid transparent;
            transition: border-color .2s
        }

        .title-input:hover {
            border-bottom-color: var(--border-default)
        }

        .title-input:focus {
            border-bottom-color: var(--accent)
        }

        .title-input::selection {
            background: var(--accent-subtle);
            color: var(--accent-subtle-text)
        }

        .theme-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-default);
            background: var(--surface-card);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 16px;
            transition: all .2s;
            user-select: none;
            flex-shrink: 0
        }

        .theme-toggle:hover {
            background: var(--surface-hover);
            border-color: var(--text-muted)
        }

        .theme-toggle:active {
            transform: scale(.92)
        }

        .add-bar {
            flex-shrink: 0;
            padding: var(--space-lg) var(--space-xl);
            background: var(--surface-card);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: flex-end;
            gap: var(--space-sm);
            flex-wrap: wrap
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: var(--space-xs);
            flex: 1 1 140px;
            min-width: 100px
        }

        .input-group label {
            font-size: var(--text-xs);
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: .5px
        }

        .input-group input {
            padding: 9px var(--space-md);
            border: 1.5px solid var(--border-default);
            border-radius: var(--radius-sm);
            font-size: var(--text-base);
            font-family: var(--font-sans);
            background: var(--surface-input);
            color: var(--text-primary);
            outline: none;
            width: 100%;
            transition: border-color .2s, box-shadow .2s;
            height: 40px
        }

        .input-group input::placeholder {
            color: var(--text-muted)
        }

        .input-group input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, .1)
        }

        .input-group input.input-error {
            border-color: var(--border-error);
            box-shadow: 0 0 0 3px rgba(239, 68, 68, .08)
        }

        .price-wrapper {
            flex: 1 1 110px
        }

        .price-input-container {
            position: relative;
            width: 100%
        }

        .price-input-container .price-prefix {
            position: absolute;
            left: var(--space-md);
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: var(--text-base);
            pointer-events: none;
            z-index: 1;
            line-height: 1
        }

        .price-input-container input {
            padding-left: 28px;
            width: 100%
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px var(--space-lg);
            border: 1px solid var(--btn-ghost-border);
            border-radius: var(--radius-sm);
            background: var(--btn-ghost-bg);
            color: var(--btn-ghost-text);
            cursor: pointer;
            font-size: var(--text-sm);
            font-weight: 500;
            font-family: var(--font-sans);
            white-space: nowrap;
            transition: all .15s;
            height: 40px;
            letter-spacing: .2px;
            user-select: none
        }

        .btn:hover {
            filter: brightness(.97)
        }

        .btn:active {
            transform: scale(.97)
        }

        .btn-add {
            background: var(--btn-success-bg);
            color: var(--btn-success-text);
            border: none;
            font-weight: 600;
            font-size: var(--text-base);
            padding: 0 var(--space-xl);
            flex-shrink: 0
        }

        .btn-add:hover {
            background: var(--success-hover);
            filter: none
        }

        .btn.copy-btn {
            background: var(--btn-copy-bg);
            border-color: var(--btn-copy-border);
            color: var(--btn-copy-text)
        }

        .btn.reset-btn {
            background: var(--btn-reset-bg);
            border-color: var(--btn-reset-border);
            color: var(--btn-reset-text)
        }

        .btn.clear-btn {
            background: var(--btn-clear-bg);
            border-color: var(--btn-clear-border);
            color: var(--btn-clear-text)
        }

        .btn.import-btn {
            background: var(--btn-import-bg);
            border-color: var(--btn-import-border);
            color: var(--btn-import-text)
        }

        .btn.share-btn {
            background: var(--btn-share-bg);
            border-color: var(--btn-share-border);
            color: var(--btn-share-text)
        }

        .btn.share-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none
        }

        .btn.copy-btn.copied {
            animation: btnPulse .4s
        }

        @keyframes btnPulse {

            0%,
            100% {
                transform: scale(1)
            }

            50% {
                transform: scale(1.04)
            }
        }

        .table-wrapper {
            flex: 1 1 0;
            min-height: 0;
            overflow-x: auto;
            overflow-y: auto
        }

        /* ===== CHANGED: min-width 720→640 ===== */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: var(--text-lg);
            min-width: 640px;
            table-layout: auto
        }

        thead {
            position: sticky;
            top: 0;
            z-index: 5
        }

        thead th {
            background: var(--surface-header);
            color: var(--text-secondary);
            font-weight: 700;
            font-size: var(--text-xs);
            text-transform: uppercase;
            letter-spacing: .6px;
            padding: var(--space-md) var(--space-lg);
            text-align: left;
            border-bottom: 2px solid var(--border-default);
            white-space: nowrap
        }

        /* ===== CHANGED: col-qty 100→80, col-price 新增 width:90px ===== */
        thead th.col-price {
            text-align: right;
            width: 90px
        }

        thead th.col-qty {
            text-align: center;
            width: 80px
        }

        thead th.col-action {
            text-align: center;
            width: 48px
        }

        thead th.col-drag {
            width: 32px;
            padding: 0;
            text-align: center
        }

        tbody td {
            padding: var(--space-md) var(--space-lg);
            border-bottom: 1px solid var(--border-light);
            vertical-align: middle;
            transition: background .15s
        }

        tbody td.col-price {
            text-align: right;
            font-weight: 600;
            font-family: var(--font-mono);
            cursor: pointer;
            color: var(--text-primary)
        }

        tbody td.col-qty {
            text-align: center
        }

        tbody td.col-action {
            text-align: center;
            padding: var(--space-sm) var(--space-md)
        }

        tbody td.col-drag {
            width: 32px;
            padding: 0;
            text-align: center
        }

        tbody tr {
            transition: background .15s
        }

        tbody tr:hover {
            background: var(--surface-hover)
        }

        /* ===== Bundle Group Rows ===== */
        tr.bundle-row td:first-child {
            border-left: 3px solid var(--bundle-color, var(--accent));
            padding-left: calc(var(--space-lg) - 3px)
        }
        tr.bundle-row td {
            border-bottom: none
        }
        tr.bundle-row-last td {
            border-bottom: 1px solid var(--border-light)
        }
        tr.bundle-row-first td {
            border-top: 2px solid var(--bundle-color, var(--accent))
        }
        tr.bundle-row-middle td {
            background: color-mix(in srgb, var(--bundle-color, var(--accent)) 4%, var(--surface-hover))
        }
        /* ===== Bundle Total Cell (first item in group) ===== */
        td.bundle-total-cell {
            text-align: right;
            font-weight: 700;
            font-family: var(--font-mono);
            color: var(--accent-subtle-text);
            cursor: pointer;
            font-size: var(--text-base)
        }
        td.bundle-total-cell:hover {
            filter: brightness(.9)
        }
        /* ===== Bundle Badge Cell (non-first items) ===== */
        td.bundle-badge-cell {
            text-align: center;
            vertical-align: middle;
            color: var(--text-muted);
            font-size: var(--text-xs)
        }
        /* ===== Bundle Button in Footer ===== */
        .btn.bundle-manage-btn {
            background: var(--accent-subtle);
            border-color: var(--border-focus);
            color: var(--accent-subtle-text)
        }
        .btn.bundle-manage-btn:hover {
            filter: brightness(.95)
        }
        /* ===== Bundle Modal ===== */
        .bundle-modal {
            max-width: 480px
        }
        .bundle-modal-section {
            border-top: 1px solid var(--border-light);
            padding-top: var(--space-lg)
        }
        .bundle-modal-section:first-of-type {
            border-top: none;
            padding-top: 0
        }
        .bundle-modal-section h4 {
            font-size: var(--text-sm);
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: var(--space-sm);
            text-transform: uppercase;
            letter-spacing: .5px
        }
        .bundle-group-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--space-sm) var(--space-md);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            margin-bottom: var(--space-xs);
            font-size: var(--text-sm);
            transition: background .15s
        }
        .bundle-group-item:hover {
            background: var(--surface-hover)
        }
        .bundle-group-item .unbundle-btn {
            cursor: pointer;
            color: var(--danger);
            font-weight: 600;
            font-size: var(--text-xs);
            padding: 2px 8px;
            border: 1px solid var(--btn-clear-border);
            border-radius: var(--radius-sm);
            background: var(--btn-clear-bg);
            transition: filter .15s;
            font-family: var(--font-sans)
        }
        .bundle-group-item .unbundle-btn:hover {
            filter: brightness(.9)
        }
        .bundle-check-list {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            padding: var(--space-sm)
        }
        .bundle-check-item {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            padding: 4px 0;
            font-size: var(--text-sm)
        }
        .bundle-check-item input[type="checkbox"] {
            accent-color: var(--accent);
            width: 15px;
            height: 15px;
            cursor: pointer;
            flex-shrink: 0
        }
        .bundle-check-item label {
            cursor: pointer;
            color: var(--text-primary);
            flex: 1
        }
        .bundle-check-item .bch-cat {
            font-weight: 600
        }
        .bundle-check-item .bch-mod {
            color: var(--text-muted);
            font-size: var(--text-xs)
        }
        .bundle-check-item.disabled {
            opacity: .5;
            pointer-events: none
        }
        .bundle-check-item.disabled label {
            cursor: not-allowed
        }
        .bundle-empty-text {
            font-size: var(--text-sm);
            color: var(--text-muted);
            padding: var(--space-sm) 0;
            font-style: italic
        }

                var dispOrder = getBundleDisplayOrder();
                for (var ci = 0; ci < dispOrder.length; ci++) {
                    var cIdx = dispOrder[ci];
                    var it = data[cIdx];
                    var bCtx = getBundleCtx(cIdx);
                    var priceStr, bgStr = '';
                    if (bCtx && bCtx.isFirst) {
                        priceStr = '¥' + bCtx.combinedPrice.toFixed(2);
                        bgStr = String(bCtx.groupNumber);
                    } else if (bCtx && bCtx.isMember) {
                        priceStr = '';
                        bgStr = String(bCtx.groupNumber);
                    } else {
                        priceStr = '¥' + (it.unitPrice * it.quantity).toFixed(2);
                    }
                    md += '| ' + it.category + ' | ' + (it.model || '—') + ' | ' + it.quantity + ' | ' + priceStr + ' | ' + bgStr + ' |\n';
                }
                md += '| **总价格** | | | **¥' + data.reduce(function (s, it) { return s + it.unitPrice * it.quantity }, 0).toFixed(2) + '** | |\n';
                var ok = function () { copyB.textContent = '✅ 已复制'; copyB.classList.add('copied'); setTimeout(function () { copyB.textContent = '📋 复制'; copyB.classList.remove('copied') }, 1800) };
                if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(md).then(ok).catch(function () { fbCopy(md); ok() }); else { fbCopy(md); ok() }
            });

            csvB.addEventListener('click', function () {
                finishEdit();
                var csv = '配件,型号,数量,总价,捆绑组\n';
                var dispOrder = getBundleDisplayOrder();
                for (var ci2 = 0; ci2 < dispOrder.length; ci2++) {
                    var cIdx2 = dispOrder[ci2];
                    var it = data[cIdx2];
                    var bCtx = getBundleCtx(cIdx2);
                    var priceStr, bgStr = '';
                    if (bCtx && bCtx.isFirst) {
                        priceStr = bCtx.combinedPrice.toFixed(2);
                        bgStr = String(bCtx.groupNumber);
                    } else if (bCtx && bCtx.isMember) {
                        priceStr = '';
                        bgStr = String(bCtx.groupNumber);
                    } else {
                        priceStr = (it.unitPrice * it.quantity).toFixed(2);
                    }
                    csv += '"' + it.category + '","' + (it.model || '') + '",' + it.quantity + ',' + priceStr + ',' + bgStr + '\n';
                }
                csv += '"总价格","",,,' + data.reduce(function (s, it) { return s + it.unitPrice * it.quantity }, 0).toFixed(2) + '\n';
                var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' }), url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = getSafeTitle() + '_' + new Date().toISOString().slice(0, 10) + '.csv'; a.click(); URL.revokeObjectURL(url); toast2('📤 CSV 已下载')
            });

            addB.addEventListener('click', addRow);
            iPri.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); addRow() } });
            iMod.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); iPri.focus() } });
            iCat.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); iMod.focus() } });
            clrB.addEventListener('click', clearAll); rstB.addEventListener('click', resetDef); shrB.addEventListener('click', shareImg);
            document.addEventListener('click', function (e) { if (curEdit && !curEdit.td.contains(e.target)) finishEdit() });
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') {
                    if (bndM.classList.contains('active')) { bndM.classList.remove('active'); return }
                    if (prvM.classList.contains('active')) { prvM.classList.remove('active'); return }
                    if (impM.classList.contains('active')) { impM.classList.remove('active'); return }
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 'c') { var a = document.activeElement, s = window.getSelection(); if ((!a || a.tagName === 'BODY' || a.tagName === 'HTML') && (!s || s.toString().length === 0)) { e.preventDefault(); copyB.click() } }
            });

            // ===== Theme Toggle =====
            function getTheme() {
                var t = localStorage.getItem('pc_theme_v1');
                if (t === 'dark' || t === 'light') return t;
                return null; // follow system
            }
            function applyTheme(t) {
                var html = document.documentElement;
                html.classList.remove('dark-mode', 'light-mode');
                if (t === 'dark') { html.classList.add('dark-mode'); themeToggle.textContent = '☀️' }
                else if (t === 'light') { html.classList.add('light-mode'); themeToggle.textContent = '🌙' }
                else { themeToggle.textContent = window.matchMedia('(prefers-color-scheme: dark)').matches ? '☀️' : '🌙' }
            }
            function toggleTheme() {
                var cur = getTheme();
                var sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                var next;
                if (cur === null) { next = sysDark ? 'light' : 'dark' }
                else if (cur === 'dark') { next = 'light' }
                else { next = 'dark' }
                localStorage.setItem('pc_theme_v1', next);
                applyTheme(next);
            }
            themeToggle.addEventListener('click', toggleTheme);
            applyTheme(getTheme());

            loadD(); loadB(); loadTitle(); render(); iCat.focus();
        })();
    </script>
</body>

</html>
